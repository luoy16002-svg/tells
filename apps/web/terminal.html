<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tells: terminal replay</title>
<script type="module">import '@fontsource/ibm-plex-mono/400.css'; import '@fontsource/ibm-plex-mono/500.css';</script>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f13; }
  body { display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace; }
  .win { width: min(1320px, 92vw); height: min(780px, 88vh); background: #15181e; border-radius: 14px; box-shadow: 0 30px 80px rgb(0 0 0 / 0.5); overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgb(255 255 255 / 0.08); }
  .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1b1f26; color: #8b93a1; font-size: 13px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3a3f4a; display: inline-block; }
  .bar span { margin-left: 10px; }
  pre { margin: 0; padding: 22px 26px; color: #d7dbe2; font: 400 16px/1.55 'IBM Plex Mono', monospace; white-space: pre-wrap; overflow: hidden; flex: 1; }
  .p { color: #f4b728; }
  .dim { color: #6f7786; }
  .crit { color: #ff5a52; font-weight: 500; }
  .high { color: #ff8a3d; }
  .med { color: #6f9bff; }
  .ok { color: #3ccf8e; }
  .b { color: #ffffff; font-weight: 500; }
  .caret { display: inline-block; width: 9px; height: 18px; background: #d7dbe2; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="win"><div class="bar"><i></i><i></i><i></i><span>tells — view-only scan, nothing leaves this machine</span></div><pre id="out"></pre></div>
<script type="module">
  const out = document.getElementById('out');
  const lines = await fetch('./terminal.json').then(r => r.json());
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const add = (html) => { out.insertAdjacentHTML('beforeend', html); out.scrollTop = out.scrollHeight; };
  for (const l of lines) {
    if (l.type === 'cmd') {
      add('<span class="p">$ </span>');
      for (const ch of l.text) { add(ch.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))); await sleep(l.typing ?? 22); }
      add('\n');
    } else {
      add(`<span class="${l.cls ?? ''}">${l.text.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</span>\n`);
    }
    await sleep(l.delay ?? 120);
  }
  add('<span class="p">$ </span><span class="caret"></span>');
</script>
</body>
</html>
