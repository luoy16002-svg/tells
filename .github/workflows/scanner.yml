name: Build the scanner
# Builds zcash-devtool (github.com/zcash/zcash-devtool) from a pinned commit for the three desktop platforms and
# attaches the binaries to a release, so `tells scan` works without a Rust toolchain. The build log is public.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: scanner-v1
permissions:
  contents: write
env:
  DEVTOOL_REPO: zcash/zcash-devtool
  DEVTOOL_COMMIT: 5a26ee854e634a4e88d1d79dab13f8fbb1eac6b8
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.DEVTOOL_REPO }}
          ref: ${{ env.DEVTOOL_COMMIT }}
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: 'true'
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/zcash-devtool${{ matrix.ext }} dist/zcash-devtool-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcash-devtool-${{ matrix.target }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist/* --repo "${{ github.repository }}" \
            --title "Scanner binaries (${{ inputs.tag }})" \
            --notes "zcash-devtool built from ${{ env.DEVTOOL_REPO }}@${{ env.DEVTOOL_COMMIT }} by this workflow. Used by \`tells scan\` when zcash-devtool is not installed. Checksums in SHA256SUMS."
